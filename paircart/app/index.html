<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PairCart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PairCart">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f8a5b">
<style>
:root{--g:#1f8a5b;--bg:#f6f8f7;--card:#fff;--t:#17211c;--m:#6b7a72;--line:#e3e9e5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18211c;--t:#e8efe9;--m:#93a39a;--line:#26322b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:17px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;gap:8px;align-items:center}
header select{flex:1;font-weight:600;font-size:18px;font-family:inherit;background:transparent;color:#fff;border:0;appearance:none;min-width:0}
header select option{color:#000}header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:680px;margin:0 auto}
.cat{margin:14px 4px 6px;font-size:13px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;min-height:52px}
.row:first-of-type{border-radius:12px 12px 0 0}.grp .row:last-child{border-radius:0 0 12px 12px;border-bottom:0}.grp .row:only-child{border-radius:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.done .chk{background:var(--g)}.done .nm{text-decoration:line-through;color:var(--m)}
.nm{flex:1;word-break:break-word}.q{color:var(--m);font-size:15px}.del{border:0;background:none;color:var(--m);font-size:20px;padding:4px 6px}
.add{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:center}
.add input{flex:1;max-width:560px;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--t)}
.add button,.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600;font-size:16px;font-family:inherit}
.btn{padding:14px 22px;font-size:17px}.empty,.center{text-align:center;color:var(--m);padding:40px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:flex;gap:14px;font-size:15px}
.toast button{background:none;border:0;color:#7fe0b0;font-weight:600;font-size:15px;font-family:inherit}.clear{display:block;margin:18px auto;background:none;border:1px solid var(--line);color:var(--m);border-radius:10px;padding:8px 14px;font:inherit;font-size:15px}
</style>
</head>
<body>
<div id="app"><div class="center">…</div></div>
<script type="module" src="app.js?v=2"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
